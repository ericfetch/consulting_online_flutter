# Codemagic 构建配置
# 文档：https://docs.codemagic.io/yaml/building-a-flutter-app/
#
# Android 和旧的未签名流程保持原工具链；TestFlight 单独使用支持 Xcode 26 的 Flutter。
# 首次接入请看 IOS_CLOUD_BUILD.md，Apple 密钥和签名文件只存 Codemagic。

workflows:
  android-build:
    name: Android Build
    max_build_duration: 60
    # Flutter 默认推荐机型；想省钱可换成 linux（对纯 Android 打包足够）
    instance_type: mac_mini_m2

    environment:
      # 锁定和本机一致的 Flutter 版本（关键）
      flutter: 3.32.8
      # 将来要发布到 Google Play 时，取消下面注释并在 Codemagic 配置签名组：
      # groups:
      #   - android_signing

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build release APK
        script: flutter build apk --release

      # 将来要上架 Play 商店时，改用 app bundle（需正式签名，见上 groups）：
      # - name: Build app bundle
      #   script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

    # 构建完成后把 APK 邮件发给你（可选，改成你的邮箱并取消注释）：
    # publishing:
    #   email:
    #     recipients:
    #       - your-email@example.com

  ios-build:
    name: iOS Build
    max_build_duration: 60
    # iOS 打包必须用 macOS 机器（需要 Xcode）
    instance_type: mac_mini_m2

    environment:
      # 锁定和本机一致的 Flutter 版本（关键）
      flutter: 3.32.8
      # 注意：真正的 iOS 分发（装真机/TestFlight/App Store）必须签名。
      # 需要 Apple 开发者账号（$99/年），并在 Codemagic 里配置签名后，
      # 取消下面注释并改用 `flutter build ipa`：
      # groups:
      #   - ios_signing

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      # 未签名构建：验证 iOS 代码能编译通过，产出 .app（不能装真机）
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign

    artifacts:
      - build/ios/iphoneos/Runner.app

  ios-testflight:
    name: iOS · TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: consulting-app-store

    environment:
      flutter: 3.38.10
      xcode: "26.2"
      cocoapods: "1.16.2"
      groups:
        - sana_ios_signing
      vars:
        APP_STORE_APPLE_ID: "6808095729"
        BUNDLE_ID: com.consulting.consultingOnlineApp

    # 手动启动此流程。首次签名成功后再按需要增加自动触发规则。
    scripts:
      - name: Verify existing App and choose iOS build number
        script: python3 scripts/prepare_ios_release.py

      - name: Get Flutter packages
        script: flutter pub get

      - name: Validate release scripts and Flutter code
        script: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_*.py'
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Install iOS dependencies
        script: |
          set -euo pipefail
          cd ios
          pod install

      - name: Fetch or create App Store signing files
        script: |
          set -euo pipefail
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build signed IPA
        script: |
          set -euo pipefail
          flutter build ipa --release --no-pub \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # 上传后在 TestFlight 查看；此开关控制外部测试的 Beta Review，不是上传开关。
        submit_to_testflight: false
        submit_to_app_store: false
